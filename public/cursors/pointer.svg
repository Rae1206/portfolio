<!-- Pointer cursor (links, buttons): a small purple flower with sage leaves. Hotspot at 16,16.
     Colors mirror src/styles/tokens.css (cursor images cannot read CSS variables);
     #8a52c9 is a deeper purple between the purple and purple-dim tokens.
     Note: XML comments cannot contain a double hyphen. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g stroke="#080807" stroke-width="1.5">
    <!-- leaves peeking out behind the petals -->
    <path d="M16 16 C 9 15 2 21 1 30 C 9 31 16 25 16 16 Z" fill="#52e062" />
    <path d="M16 16 C 23 15 30 21 31 30 C 23 31 16 25 16 16 Z" fill="#52e062" />

    <ellipse cx="16" cy="10" rx="3.3" ry="5" fill="#ff2aa8" />
    <ellipse cx="16" cy="10" rx="3.3" ry="5" fill="#b042ff" transform="rotate(72 16 16)" />
    <ellipse cx="16" cy="10" rx="3.3" ry="5" fill="#ff2aa8" transform="rotate(144 16 16)" />
    <ellipse cx="16" cy="10" rx="3.3" ry="5" fill="#b042ff" transform="rotate(216 16 16)" />
    <ellipse cx="16" cy="10" rx="3.3" ry="5" fill="#ff2aa8" transform="rotate(288 16 16)" />
    <circle cx="16" cy="16" r="3.4" fill="#80ff8e" />
  </g>
</svg>
